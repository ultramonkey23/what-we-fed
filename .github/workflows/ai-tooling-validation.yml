name: AI Doctrine and Report Validation

# One ordered validation lane for the AI doctrine scanners and report scorer.
# It replaces two stale workflows whose context-pack and prompt-lint commands no
# longer exist on the current repository tree.

on:
  push:
    paths:
      - "tools/ai/**"
      - "docs/ai/**"
      - ".github/workflows/ai-tooling-validation.yml"
      - ".github/workflows/brain_remote.yml"
  pull_request:
    paths:
      - "tools/ai/**"
      - "docs/ai/**"
      - ".github/workflows/ai-tooling-validation.yml"
      - ".github/workflows/brain_remote.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-tooling-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-ai-tools:
    name: Validate active doctrine and report scoring
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10 compatibility floor
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile current AI validation tools
        run: |
          python -m py_compile \
            tools/ai/check_soul_integrity.py \
            tools/ai/check_active_ai_doctrine.py \
            tools/ai/validate_soul.py \
            tools/ai/score_agent_report.py \
            tools/ai/validate_report_scorer.py

      - name: Check active AI doctrine
        shell: bash
        run: |
          set +e
          python tools/ai/check_active_ai_doctrine.py
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 1 ]; then
            echo "::warning::Active doctrine checker reported non-fatal drift warnings."
            exit 0
          fi
          echo "::error::Active doctrine checker reported hard violations."
          exit "$status"

      - name: Validate report scorer fixture contract
        run: python tools/ai/validate_report_scorer.py
